services:
  - type: web
    name: veri-byte-backend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: INSIGHTFACE_DET_SIZE
        value: "320"
      - key: TESSERACT_CMD
        value: "/usr/bin/tesseract"
      - key: ENABLE_NEURAL_DEEPFAKE
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
